name: Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/omnibot_tdisplay/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/omnibot_tdisplay/platformio.ini', 'firmware/omnibot_tdisplay/scripts/patch_ps3_ssp.py') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build T-Display firmware
        working-directory: firmware/omnibot_tdisplay
        run: pio run

      - name: Prepare release binaries
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release_assets
          cp firmware/omnibot_tdisplay/.pio/build/lilygo-t-display/bootloader.bin release_assets/
          cp firmware/omnibot_tdisplay/.pio/build/lilygo-t-display/partitions.bin release_assets/
          cp firmware/omnibot_tdisplay/.pio/build/lilygo-t-display/firmware.bin "release_assets/omnibot-tdisplay-${TAG}.bin"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release_assets/
          ~/.platformio/packages/tool-esptool/esptool --chip esp32 merge-bin \
            -o "release_assets/omnibot-tdisplay-${TAG}-merged.bin" \
            --flash-mode dio --flash-freq 40m --flash-size 4MB \
            0x1000 release_assets/bootloader.bin \
            0x8000 release_assets/partitions.bin \
            0xe000 release_assets/boot_app0.bin \
            0x10000 "release_assets/omnibot-tdisplay-${TAG}.bin"
          (cd release_assets && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release_assets/* --clobber
          else
            gh release create "${TAG}" release_assets/* \
              --title "Omnibot T-Display ${TAG}" \
              --notes-file CHANGELOG.md
          fi
